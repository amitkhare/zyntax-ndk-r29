plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java-library'
    id 'maven-publish'
}

def release = gradle.ext.agpRelease
ext.moduleSourceSha256 = release.modelSourceSha256
ext.modulePomSha256 = release.modelPomSha256
ext.modulePatch = 'builder-model.patch'
apply from: rootProject.file('source-module.gradle')

// A transitive request cannot silently introduce a second copy of these API classes.
['apiElements', 'runtimeElements'].each { name ->
    configurations.named(name) {
        outgoing.capability("${project.group}:${project.name}:${project.version}")
        outgoing.capability("com.android.tools.build:builder-model:${release.version}")
    }
}
