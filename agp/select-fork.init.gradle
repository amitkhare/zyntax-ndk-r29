import groovy.json.JsonSlurper
import org.gradle.api.artifacts.repositories.FlatDirectoryArtifactRepository
import org.gradle.api.artifacts.repositories.IvyArtifactRepository
import org.gradle.api.artifacts.repositories.MavenArtifactRepository

// Explicit --init-script entry point; never install in Gradle's global init directories.
def releases = new JsonSlurper().parse(new File(initscript.sourceFile.parentFile, 'releases.json'))
def pluginIds = releases.values().collectMany { it.pluginIds }.toSet()
def forkModules = ['gradle', 'builder-model']
def nativePluginIds = ['com.android.application', 'com.android.library', 'com.android.dynamic-feature', 'com.android.test']

beforeSettings { settings ->
    def repository = settings.providers.gradleProperty('zyntaxAgpRepository').orNull
    if (!repository) throw new GradleException('Set -PzyntaxAgpRepository to the fork Maven repository path or URI.')
    def repositoryFile = new File(repository)
    def repositoryUri = repositoryFile.absolute ? repositoryFile.toURI() : new URI(repository)
    if (!(repositoryUri.scheme in ['file', 'https']) || repositoryUri.userInfo || repositoryUri.query || repositoryUri.fragment) {
        throw new GradleException('The fork repository must be an absolute path or a file/HTTPS URI without credentials, query or fragment.')
    }

    def selectFork = { requested, version, pluginId, module ->
        def release = releases[version]
        if (release == null || (pluginId != null && !release.pluginIds.contains(pluginId))) {
            throw new GradleException("No exact Zyntax AGP fork for ${requested}:${version}; declare a supported version.")
        }
        def coordinate = "app.zyntax.tools.build:${module}:${release.forkVersion}"
        logger.lifecycle("Zyntax AGP: ${requested}:${version} -> ${coordinate} (${repositoryUri})")
        [version: release.forkVersion, coordinate: coordinate]
    }
    def configureRepository = { repositories ->
        def forkRepository = repositories.maven {
            name = 'ZyntaxAgpFork'
            url = repositoryUri
            content { descriptor -> forkModules.each { descriptor.includeModule('app.zyntax.tools.build', it) } }
        }
        [MavenArtifactRepository, IvyArtifactRepository, FlatDirectoryArtifactRepository].each { type ->
            repositories.withType(type).all { repositoryEntry ->
                if (repositoryEntry != forkRepository) {
                    repositoryEntry.content { descriptor -> forkModules.each { descriptor.excludeModule('app.zyntax.tools.build', it) } }
                }
            }
        }
    }
    configureRepository(settings.pluginManagement.repositories)
    settings.pluginManagement.resolutionStrategy.eachPlugin { details ->
        def id = details.requested.id.id
        if (!pluginIds.contains(id)) return
        if (details.target.version == null) return // Gradle owns unversioned inherited plugin requests.
        def selected = selectFork(id, details.target.version, id, 'gradle')
        // Set the version first so repeated project requests match the loaded fork.
        details.useVersion(selected.version)
        details.useModule(selected.coordinate)
    }

    def ndkDirectory = settings.providers.gradleProperty('zyntaxNdkDirectory').orNull
    def ndkRevision = null
    if (ndkDirectory != null) {
        def ndk = new File(ndkDirectory)
        def propertiesFile = new File(ndk, 'source.properties')
        if (!ndk.absolute || !ndk.directory || !propertiesFile.file) {
            throw new GradleException('zyntaxNdkDirectory must be an absolute NDK directory containing source.properties.')
        }
        def properties = new Properties()
        propertiesFile.withInputStream { properties.load(it) }
        ndkRevision = properties.getProperty('Pkg.Revision')
        if (!(ndkRevision ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
            throw new GradleException('The selected NDK source.properties must declare an exact Pkg.Revision.')
        }
        ndkDirectory = ndk.canonicalPath
    }

    gradle.beforeProject { project ->
        configureRepository(project.buildscript.repositories)
        project.buildscript.configurations.matching { it.name == 'classpath' }.configureEach { configuration ->
            configuration.resolutionStrategy.eachDependency { details ->
                def requested = details.requested
                if (requested.group != 'com.android.tools.build' || !forkModules.contains(requested.name)) return
                def selected = selectFork("${requested.group}:${requested.name}", requested.version, null, requested.name)
                details.useTarget(selected.coordinate)
                details.because('Explicit Zyntax Android-host AGP selection')
            }
        }
        if (ndkDirectory != null) {
            nativePluginIds.each { id ->
                project.pluginManager.withPlugin(id) {
                    project.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                        def nativeBuild = dsl.externalNativeBuild
                        if (nativeBuild.cmake.path == null && nativeBuild.ndkBuild.path == null) return
                        if (dsl.ndkVersion != ndkRevision) {
                            throw new GradleException("${project.path} requests NDK ${dsl.ndkVersion}, but the selected directory contains ${ndkRevision}.")
                        }
                        dsl.ndkPath = ndkDirectory
                        logger.lifecycle("Zyntax NDK: ${project.path} ${ndkRevision} -> ${ndkDirectory}")
                    }
                }
            }
        }
    }
}
