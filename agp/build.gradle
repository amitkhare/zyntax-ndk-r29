import java.nio.file.Files

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java-library'
    id 'maven-publish'
}

// Configure typed Kotlin options where the plugin supplies its script classpath.
allprojects {
    plugins.withId('org.jetbrains.kotlin.jvm') {
        kotlin.compilerOptions {
            moduleName = project == rootProject ? 'gradle-core' : project.name
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
            apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
            languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
            freeCompilerArgs.add('-Xjvm-default=all-compatibility')
        }
    }
}

def release = gradle.ext.agpRelease
def upstreamVersion = release.version
ext.moduleSourceSha256 = release.sourceSha256
ext.modulePomSha256 = release.pomSha256
ext.modulePatch = release.patch
apply from: 'source-module.gradle'

def aaptVersion = upstreamPom.dependencies.dependency.find { it.artifactId.text() == 'aapt2-proto' }.version.text()
if (!aaptVersion.startsWith(upstreamVersion + '-')) throw new GradleException('Unexpected AAPT2 metadata')

dependencies {
    compileOnly gradleApi()
    compileOnly "com.android.tools:common:${release.tools}"
    compileOnly "com.android.tools:annotations:${release.tools}"
    compileOnly "org.jetbrains.kotlin:kotlin-gradle-plugin:${release.kotlin}"
    compileOnly "org.jetbrains.kotlin:kotlin-gradle-plugin-idea:${release.kotlin}"
    compileOnly "org.jacoco:org.jacoco.core:${release.jacoco}"
    compileOnly "org.jacoco:org.jacoco.report:${release.jacoco}"
    compileOnly "org.jetbrains.dokka:dokka-core:${release.dokka}"
}

// Exact proto resources omitted by Google's AGP sources JAR. Each was compared
// byte-for-byte with its release resource and pinned to an immutable source commit.
def protoDigests = [
    'app_bundle_dependencies_metadata.proto': 'f499cfed9932de17feec50b6e53a3cdd4c38898ec9761fe8b64215d7a266f675',
    'cxx_attribution.proto': 'b32e4ea8608a53a7b5840d3e25278e2aef8eee0ac91e83b065bcdf3207b73497',
    'cxx_caching.proto': '2f278457e1abde3401994b50cd22f6682cf719396f1c2df567804e9dc473c4e2',
    'cxx_configure.proto': release.configureProtoSha256,
    'cxx_io.proto': '843a067fef95718cc6c75f76fd8bb06e4aa01d4d128b59ac677dab7a6cef07f6',
    'cxx_logging.proto': 'bd250849816752e979268b9dde0837a3629831ef7eea834a0b21eb4a85d693d7',
    'cxx_process.proto': '713310e2c88d0d1288d65f287ded2773b97765accca0dd8f2b47fa46a3ee85c5',
    'version_control_metadata.proto': release.versionControlProtoSha256,
]

tasks.named('prepareSources') {
    doLast {
        protoDigests.each { name, digest ->
            def url = "https://android.googlesource.com/platform/tools/base/+/${release.protoCommit}/build-system/gradle-core/src/main/proto/${name}?format=TEXT"
            def proto = verifiedInput("${upstreamVersion}-${name}", url, digest, true)
            Files.copy(proto.toPath(), new File(sourceDirectory, name).toPath())
        }
        def aaptProperties = new File(sourceDirectory, 'com/android/build/gradle/internal/res/aapt2_version.properties')
        aaptProperties.parentFile.mkdirs()
        aaptProperties.text = "aapt2Version=${aaptVersion.substring(upstreamVersion.length() + 1)}\n"
        new File(sourceDirectory, 'META-INF/gradle-plugins/com.android.ai-pack.properties').text =
            'implementation-class=com.android.build.gradle.AiPackPlugin\n'
    }
}

kotlin.compilerOptions {
    freeCompilerArgs.addAll('-Xlambdas=class',
        '-Xsam-conversions=class', '-Xjdk-release=11', '-XXLanguage:-TypeEnhancementImprovementsInStrictMode')
}
tasks.named('publish') { dependsOn ':builder-model:publish' }
