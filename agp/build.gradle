import groovy.xml.XmlSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'java-library'
    id 'maven-publish'
}

group = 'app.zyntax.tools.build'
version = '8.12.3-zyntax.1'
layout.buildDirectory = file('../.work/agp/build')

def upstreamVersion = '8.12.3'
def inputsDirectory = file('../.work/agp/inputs')
def sourceDirectory = file('../.work/agp/sources')
def upstreamBase = "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/${upstreamVersion}/gradle-${upstreamVersion}"
def sourceDigest = '794e59abd62d9474d17b55047a874cfe1f6bbc82245dd8b7a3ce8d8aae70d231'
def pomDigest = '83a144a5214416ce3d88a89d290e48a5db7f25ab0957e41d6032ba652cf56801'
def sha256 = { byte[] bytes -> MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
def verifiedInput = { String name, String url, String digest, boolean base64 = false ->
    def destination = new File(inputsDirectory, name)
    if (!destination.exists()) {
        inputsDirectory.mkdirs()
        byte[] bytes = new URI(url).toURL().bytes
        if (base64) bytes = Base64.decoder.decode(bytes)
        if (sha256(bytes) != digest) throw new GradleException("Source checksum mismatch: ${name}")
        def temporary = new File(inputsDirectory, name + '.part')
        temporary.bytes = bytes
        Files.move(temporary.toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
    }
    if (sha256(destination.bytes) != digest) throw new GradleException("Cached source checksum mismatch: ${name}")
    destination
}

// The exact upstream POM supplies peer dependencies, never the upstream implementation JAR.
def upstreamPomFile = verifiedInput('gradle-8.12.3.pom', upstreamBase + '.pom', pomDigest)
def upstreamPom = new XmlSlurper().parse(upstreamPomFile)
def aaptVersion = upstreamPom.dependencies.dependency.find { it.artifactId.text() == 'aapt2-proto' }.version.text()
if (!aaptVersion.startsWith(upstreamVersion + '-')) throw new GradleException('Unexpected AAPT2 metadata')

repositories {
    google()
    mavenCentral()
}

dependencies {
    upstreamPom.dependencies.dependency.each { dependency ->
        def scope = dependency.scope.text() == 'compile' ? 'api' : 'implementation'
        add(scope, "${dependency.groupId.text()}:${dependency.artifactId.text()}:${dependency.version.text()}")
    }
    compileOnly gradleApi()
    compileOnly 'com.android.tools:common:31.12.3'
    compileOnly 'com.android.tools:annotations:31.12.3'
    compileOnly 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
    compileOnly 'org.jetbrains.kotlin:kotlin-gradle-plugin-idea:2.1.20'
    compileOnly 'org.jacoco:org.jacoco.core:0.8.13'
    compileOnly 'org.jacoco:org.jacoco.report:0.8.13'
    compileOnly 'org.jetbrains.dokka:dokka-core:1.4.32'
}

configurations.compileClasspath.incoming.afterResolve {
    def forbidden = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.find {
        it.moduleVersion.id.group == 'com.android.tools.build' && it.name == 'gradle'
    }
    if (forbidden != null) throw new GradleException('The upstream AGP implementation must not be a compiler input')
}

// Exact proto resources omitted by Google's sources JAR. Each was compared byte-for-byte
// with the 8.12.3 release resource; their immutable source commit is pinned independently.
def protoCommit = '7dee427b8411d0356b29aad83651db2612f9340b'
def protoDigests = [
    'app_bundle_dependencies_metadata.proto': 'f499cfed9932de17feec50b6e53a3cdd4c38898ec9761fe8b64215d7a266f675',
    'cxx_attribution.proto': 'b32e4ea8608a53a7b5840d3e25278e2aef8eee0ac91e83b065bcdf3207b73497',
    'cxx_caching.proto': '2f278457e1abde3401994b50cd22f6682cf719396f1c2df567804e9dc473c4e2',
    'cxx_configure.proto': 'ab4a44be64dacbdbe5671f2b302f6b848d28ed21d22ab2aeaae7d894f5eae6d5',
    'cxx_io.proto': '843a067fef95718cc6c75f76fd8bb06e4aa01d4d128b59ac677dab7a6cef07f6',
    'cxx_logging.proto': 'bd250849816752e979268b9dde0837a3629831ef7eea834a0b21eb4a85d693d7',
    'cxx_process.proto': '713310e2c88d0d1288d65f287ded2773b97765accca0dd8f2b47fa46a3ee85c5',
    'version_control_metadata.proto': 'f8fe3d60bb0f4056754b4856245061d22e9dbf9a46ae1d20792f730d0240a211',
]

def prepareSources = tasks.register('prepareSources') {
    inputs.file('ndk-host.patch')
    inputs.file('build.gradle')
    outputs.dir(sourceDirectory)
    doLast {
        def archive = verifiedInput('gradle-8.12.3-sources.jar', upstreamBase + '-sources.jar', sourceDigest)
        delete(sourceDirectory)
        sourceDirectory.mkdirs()
        new ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.directory || entry.name == 'META-INF/MANIFEST.MF') return
                // Google's generated protobuf sources appear twice, under java/ and their
                // package path. Normalize only identical copies; a conflict is an error.
                def name = entry.name.startsWith('java/') ? entry.name.substring(5) : entry.name
                def destination = sourceDirectory.toPath().resolve(name).normalize()
                if (!destination.startsWith(sourceDirectory.toPath())) throw new GradleException('Invalid source archive path')
                byte[] bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                if (Files.exists(destination)) {
                    if (!Arrays.equals(Files.readAllBytes(destination), bytes)) throw new GradleException("Conflicting source: ${name}")
                } else {
                    Files.createDirectories(destination.parent)
                    Files.write(destination, bytes)
                }
            }
        }
        protoDigests.each { name, digest ->
            def url = "https://android.googlesource.com/platform/tools/base/+/${protoCommit}/build-system/gradle-core/src/main/proto/${name}?format=TEXT"
            def proto = verifiedInput(name, url, digest, true)
            Files.copy(proto.toPath(), new File(sourceDirectory, name).toPath())
        }
        exec {
            workingDir projectDir.parentFile
            commandLine 'git', 'apply', '--directory=.work/agp/sources', new File(projectDir, 'ndk-host.patch').absolutePath
        }
        def aaptProperties = new File(sourceDirectory, 'com/android/build/gradle/internal/res/aapt2_version.properties')
        aaptProperties.parentFile.mkdirs()
        aaptProperties.text = "aapt2Version=${aaptVersion.substring(upstreamVersion.length() + 1)}\n"
        new File(sourceDirectory, 'META-INF/gradle-plugins/com.android.ai-pack.properties').text =
            'implementation-class=com.android.build.gradle.AiPackPlugin\n'
        new File(sourceDirectory, 'META-INF/zyntax-agp.properties').text =
            "coordinate=${project.group}:${project.name}:${project.version}\nupstreamVersion=${upstreamVersion}\nsourceSha256=${sourceDigest}\n"
    }
}

sourceSets.main {
    java.setSrcDirs([sourceDirectory])
    resources.setSrcDirs([sourceDirectory])
    resources.exclude('**/*.java', '**/*.kt')
}
kotlin.sourceSets.main.kotlin.setSrcDirs([sourceDirectory])
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
kotlin.compilerOptions {
    moduleName = 'gradle-core'
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
    languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
    freeCompilerArgs.addAll('-Xjvm-default=all-compatibility', '-Xlambdas=class',
        '-Xsam-conversions=class', '-Xjdk-release=11', '-XXLanguage:-TypeEnhancementImprovementsInStrictMode')
}
tasks.named('compileKotlin') { dependsOn prepareSources }
tasks.named('compileJava') { dependsOn prepareSources; options.release = 11 }
tasks.named('processResources') { dependsOn prepareSources }
tasks.named('jar') {
    manifest.attributes('Implementation-Title': 'Zyntax Android-host AGP',
        'Implementation-Version': project.version, 'Plugin-Version': upstreamVersion)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def sourcesJar = tasks.register('sourcesJar', Jar) {
    dependsOn prepareSources
    archiveClassifier = 'sources'
    from(sourceDirectory)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
publishing {
    publications {
        fork(MavenPublication) {
            from components.java
            artifact sourcesJar
            pom {
                name = 'Zyntax Android-host AGP'
                description = 'Complete source rebuild of AGP 8.12.3 with native ARM64 host lookup.'
                licenses { license { name = 'Apache License, Version 2.0'; url = 'https://www.apache.org/licenses/LICENSE-2.0' } }
            }
        }
    }
    repositories { maven { url = layout.buildDirectory.dir('repository') } }
}
